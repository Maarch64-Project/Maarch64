name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Unicorn & AArch64 Cross Compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libunicorn-dev

      - name: Cargo Check
        run: cargo check --workspace

      - name: Cargo Test
        run: cargo test --workspace

      - name: Run Unicorn Differential Verification
        run: cargo run -p maarch64-diff-test

      - name: Build Test Fixtures & Run Runner
        run: |
          bash tests/build_fixtures.sh
          cargo run -p maarch64-runner -- tests/bin/hello_arm64
