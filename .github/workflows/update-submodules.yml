name: Auto Update Submodules

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch:      # Manual trigger from GitHub UI
  repository_dispatch:   # Webhook trigger from child repos
    types: [submodule_update]

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: true
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update submodules
        run: |
          git submodule update --remote --recursive

      - name: Create Pull Request if submodules changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update git submodules"
          title: "chore(deps): Automated Submodule Update"
          body: |
            Automated PR generated by GitHub Actions to update submodules (`core`, `thunks`, `tools`, `docs`, `tests`) to their latest commit on main.
          branch: "chore/update-submodules"
          base: "dev"
          labels: "dependencies, automated-pr"
