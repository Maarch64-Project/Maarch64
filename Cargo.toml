[workspace]
resolver = "2"
members = [
    "core",
    "thunks",
    "tests",
    "tools/maarch64-runner",
    "tools/maarch64-diff-test",
    "tools/maarch64-busybox-bench",
]
default-members = ["tools/maarch64-runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Maarch64 Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Maarch64-Project/Maarch64"

[workspace.dependencies]
object = "0.36"
nix = { version = "0.29", features = ["mman", "signal", "process"] }
libc = "0.2"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
unicorn-engine = "2.0"
bad64 = "0.12"
libloading = "0.8"
